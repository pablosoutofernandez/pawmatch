<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Perro misterioso">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="42%" r="55%">
      <stop offset="0" stop-color="#f02d5e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f02d5e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#halo)"/>

  <!-- Silueta de perro (sentado, mirando al frente) -->
  <g fill="#0b1220" stroke="#f02d5e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Cabeza -->
    <path d="M200 120
             c -36 0 -64 22 -68 52
             c -2 18 6 34 18 44
             c -2 10 -6 18 -12 24
             c 12 4 26 2 36 -6
             c 8 4 16 6 26 6
             c 10 0 18 -2 26 -6
             c 10 8 24 10 36 6
             c -6 -6 -10 -14 -12 -24
             c 12 -10 20 -26 18 -44
             c -4 -30 -32 -52 -68 -52 z"/>
    <!-- Orejas caídas -->
    <path d="M150 138
             c -14 4 -22 18 -22 36
             c 0 12 6 22 14 28
             c 4 -22 8 -42 8 -64 z"/>
    <path d="M250 138
             c 14 4 22 18 22 36
             c 0 12 -6 22 -14 28
             c -4 -22 -8 -42 -8 -64 z"/>
  </g>

  <!-- Ojos brillantes (rosados, misteriosos) -->
  <circle cx="178" cy="180" r="6" fill="#f02d5e"/>
  <circle cx="222" cy="180" r="6" fill="#f02d5e"/>
  <circle cx="180" cy="178" r="1.8" fill="#ffe1ea"/>
  <circle cx="224" cy="178" r="1.8" fill="#ffe1ea"/>

  <!-- Nariz y boca -->
  <path d="M200 208
           c -6 0 -10 4 -10 8
           c 0 4 4 6 10 6
           c 6 0 10 -2 10 -6
           c 0 -4 -4 -8 -10 -8 z"
        fill="#f02d5e"/>
  <path d="M200 222 v 8 M200 230 c -6 0 -10 -2 -12 -6 M200 230 c 6 0 10 -2 12 -6"
        fill="none" stroke="#f02d5e" stroke-width="2" stroke-linecap="round"/>

  <!-- Signo de interrogación grande, semi-transparente -->
  <text x="200" y="328" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="92" font-weight="800"
        fill="#f02d5e" fill-opacity="0.95"
        letter-spacing="-2">?</text>

  <!-- Etiqueta -->
  <text x="200" y="366" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="14" font-weight="700" letter-spacing="3"
        fill="#94a3b8">PERRO MISTERIOSO</text>
</svg>
